<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      What crawlers and link previews read before JavaScript runs. %PUBLIC_URL%
      is replaced with the site's address when the BFF serves this file.
      Pages set their own title once the app has loaded (src/page-meta.ts).
    -->
    <title>Platform Booking</title>
    <!-- Dark mode before the first paint (public/theme.js). -->
    <script src="/theme.js"></script>
    <meta
      name="description"
      content="Book the team's test platforms: see which are free, who is on each and until when, and release them when you're done."
    />
    <link rel="canonical" href="%PUBLIC_URL%/" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Platform Booking" />
    <meta property="og:title" content="Platform Booking" />
    <meta
      property="og:description"
      content="See which test platforms are free, and book them."
    />
    <meta property="og:url" content="%PUBLIC_URL%/" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Platform Booking",
        "url": "%PUBLIC_URL%",
        "description": "Book the team's test platforms: see which are free, who is on each and until when, and release them when you're done."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
