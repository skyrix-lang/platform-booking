# The production image on your machine, with everything it needs:
#
#   yarn docker:up        then http://localhost:8080
#
# It shows the deploy order (database, then migrations, then the app) and is a
# way to try the real image before shipping it. For local use only: the
# password below is public. Production uses compose.production.yaml, and
# day-to-day work uses `yarn dev`.
name: platform-booking

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: platform_booking
      POSTGRES_PASSWORD: platform_booking
      POSTGRES_DB: platform_booking
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-U", "platform_booking"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies the migrations, adds the default platforms to an empty database,
  # and exits. The app starts only when it succeeded.
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://platform_booking:platform_booking@db:5432/platform_booking
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runner
    environment:
      PUBLIC_URL: http://localhost:${APP_PORT:-8080}
      DATABASE_URL: postgres://platform_booking:platform_booking@db:5432/platform_booking
    ports:
      - "${APP_PORT:-8080}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Time for in-flight requests to finish after SIGTERM (apps/bff/src/server.ts).
    stop_grace_period: 15s

volumes:
  db:
